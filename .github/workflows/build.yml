name: Build and release unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # macOS 26 on the Intel pool: same Xcode, much shorter queues than the
    # arm64 macos-latest pool. xtool still produces an arm64 app.
    runs-on: macos-26-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Install xtool
        run: brew install xtool-org/tap/xtool

      # On macOS xtool uses the runner's Xcode SDK, so no Apple login or
      # SDK download is needed for an unsigned build.
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Set version
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.${GITHUB_RUN_NUMBER}" Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}" Info.plist

      - name: Build IPA
        run: xtool dev build -c release --ipa

      - name: Name IPA
        run: cp xtool/ShortSign.ipa "xtool/ShortSign-1.0.${GITHUB_RUN_NUMBER}.ipa"

      - name: Build changelog
        run: |
          TAG="v1.0.${GITHUB_RUN_NUMBER}"
          PREVIOUS=$(git tag --list 'v1.0.*' --sort=-v:refname | grep -v "^${TAG}$" | head -n 1 || true)
          {
            echo "## ShortSign 1.0.${GITHUB_RUN_NUMBER}"
            echo
            echo "Commit: \`${GITHUB_SHA}\`"
            echo
            if [ -n "$PREVIOUS" ]; then
              echo "Changes since \`${PREVIOUS}\`:"
              echo
              git log --pretty=format:'- %s (%h)' "${PREVIOUS}..HEAD"
              echo
              echo
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREVIOUS}...${TAG}"
            else
              echo "Initial release."
              echo
              git log --pretty=format:'- %s (%h)' HEAD
            fi
          } > CHANGELOG.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.${GITHUB_RUN_NUMBER}"
          TITLE="ShortSign 1.0.${GITHUB_RUN_NUMBER}"
          IPA="xtool/ShortSign-1.0.${GITHUB_RUN_NUMBER}.ipa"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes-file CHANGELOG.md
            gh release upload "$TAG" "$IPA" CHANGELOG.md --clobber
          else
            gh release create "$TAG" "$IPA" CHANGELOG.md \
              --title "$TITLE" \
              --notes-file CHANGELOG.md \
              --target "$GITHUB_SHA"
          fi
